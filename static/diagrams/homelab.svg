<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" style="background-color: white;">
  <defs>
    <style>
      .node-box { fill: #2c3e50; stroke: #34495e; stroke-width: 2; }
      .node-text { fill: white; font-family: Arial, sans-serif; font-size: 14px; }
      .node-title { fill: white; font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; }
      .storage-box { fill: #27ae60; stroke: #229954; stroke-width: 2; }
      .backup-box { fill: #e67e22; stroke: #d35400; stroke-width: 2; }
      .cloud-box { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .service-box { fill: #8e44ad; stroke: #7d3c98; stroke-width: 2; }
      .connection { stroke: #95a5a6; stroke-width: 2; fill: none; }
      .arrow { fill: #95a5a6; }
      .section-title { fill: #2c3e50; font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; }
      .label-text { fill: #2c3e50; font-family: Arial, sans-serif; font-size: 12px; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" class="arrow" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="40" class="section-title" text-anchor="middle">Frostlabs Homelab Architecture</text>

  <!-- Docker Swarm Cluster Section -->
  <text x="70" y="90" class="section-title">Docker Swarm Cluster</text>

  <!-- Leader Node (p0) -->
  <rect x="50" y="110" width="200" height="120" rx="10" class="node-box"/>
  <text x="150" y="135" class="node-title" text-anchor="middle">p0 (Manager/Leader)</text>
  <text x="150" y="155" class="node-text" text-anchor="middle">BeeLink SER 5</text>
  <text x="150" y="175" class="node-text" text-anchor="middle">AMD Ryzen 5800H (16c)</text>
  <text x="150" y="195" class="node-text" text-anchor="middle">32GB RAM | 1TB SSD</text>
  <text x="150" y="215" class="node-text" text-anchor="middle">10.0.4.11</text>

  <!-- Worker Nodes -->
  <rect x="280" y="110" width="160" height="120" rx="10" class="node-box"/>
  <text x="360" y="135" class="node-title" text-anchor="middle">p1 (Worker)</text>
  <text x="360" y="155" class="node-text" text-anchor="middle">Raspberry Pi 5</text>
  <text x="360" y="175" class="node-text" text-anchor="middle">8GB RAM</text>
  <text x="360" y="195" class="node-text" text-anchor="middle">512GB SSD</text>

  <rect x="470" y="110" width="160" height="120" rx="10" class="node-box"/>
  <text x="550" y="135" class="node-title" text-anchor="middle">p2 (Worker)</text>
  <text x="550" y="155" class="node-text" text-anchor="middle">Raspberry Pi 5</text>
  <text x="550" y="175" class="node-text" text-anchor="middle">16GB RAM</text>

  <rect x="660" y="110" width="160" height="120" rx="10" class="node-box"/>
  <text x="740" y="135" class="node-title" text-anchor="middle">p3 (Worker)</text>
  <text x="740" y="155" class="node-text" text-anchor="middle">Raspberry Pi 5</text>
  <text x="740" y="175" class="node-text" text-anchor="middle">16GB RAM</text>

  <!-- Services Section -->
  <text x="70" y="290" class="section-title">Production Services (12 Total)</text>

  <!-- Service Grid -->
  <rect x="50" y="310" width="150" height="60" rx="5" class="service-box"/>
  <text x="125" y="335" class="node-text" text-anchor="middle">Traefik v3.5</text>
  <text x="125" y="355" class="node-text" text-anchor="middle" style="font-size: 11px;">Reverse Proxy</text>

  <rect x="220" y="310" width="150" height="60" rx="5" class="service-box"/>
  <text x="295" y="335" class="node-text" text-anchor="middle">Authentik</text>
  <text x="295" y="355" class="node-text" text-anchor="middle" style="font-size: 11px;">SSO/Auth</text>

  <rect x="390" y="310" width="150" height="60" rx="5" class="service-box"/>
  <text x="465" y="335" class="node-text" text-anchor="middle">Portainer</text>
  <text x="465" y="355" class="node-text" text-anchor="middle" style="font-size: 11px;">Container Mgmt</text>

  <rect x="560" y="310" width="150" height="60" rx="5" class="service-box"/>
  <text x="635" y="335" class="node-text" text-anchor="middle">Paperless-ngx</text>
  <text x="635" y="355" class="node-text" text-anchor="middle" style="font-size: 11px;">Document Mgmt</text>

  <rect x="50" y="390" width="150" height="60" rx="5" class="service-box"/>
  <text x="125" y="415" class="node-text" text-anchor="middle">N8N</text>
  <text x="125" y="435" class="node-text" text-anchor="middle" style="font-size: 11px;">Workflow/CI/CD</text>

  <rect x="220" y="390" width="150" height="60" rx="5" class="service-box"/>
  <text x="295" y="415" class="node-text" text-anchor="middle">Adminer</text>
  <text x="295" y="435" class="node-text" text-anchor="middle" style="font-size: 11px;">DB Admin</text>

  <rect x="390" y="390" width="150" height="60" rx="5" class="service-box"/>
  <text x="465" y="415" class="node-text" text-anchor="middle">PostgreSQL</text>
  <text x="465" y="435" class="node-text" text-anchor="middle" style="font-size: 11px;">Database</text>

  <rect x="560" y="390" width="150" height="60" rx="5" class="service-box"/>
  <text x="635" y="415" class="node-text" text-anchor="middle">Redis</text>
  <text x="635" y="435" class="node-text" text-anchor="middle" style="font-size: 11px;">Cache/Sessions</text>

  <rect x="50" y="470" width="150" height="60" rx="5" class="service-box"/>
  <text x="125" y="495" class="node-text" text-anchor="middle">Tracker</text>
  <text x="125" y="515" class="node-text" text-anchor="middle" style="font-size: 11px;">Custom App</text>

  <rect x="220" y="470" width="150" height="60" rx="5" class="service-box"/>
  <text x="295" y="495" class="node-text" text-anchor="middle">Gitea</text>
  <text x="295" y="515" class="node-text" text-anchor="middle" style="font-size: 11px;">Git Server</text>

  <rect x="390" y="470" width="150" height="60" rx="5" class="service-box"/>
  <text x="465" y="495" class="node-text" text-anchor="middle">Rsync Service</text>
  <text x="465" y="515" class="node-text" text-anchor="middle" style="font-size: 11px;">Backup Sync</text>

  <rect x="560" y="470" width="150" height="60" rx="5" class="service-box"/>
  <text x="635" y="495" class="node-text" text-anchor="middle">+ More</text>
  <text x="635" y="515" class="node-text" text-anchor="middle" style="font-size: 11px;">Additional Services</text>

  <!-- Storage & Backup Section -->
  <text x="950" y="90" class="section-title">Storage & Backup</text>

  <!-- Local Storage on p0 -->
  <rect x="900" y="110" width="220" height="80" rx="10" class="storage-box"/>
  <text x="1010" y="135" class="node-title" text-anchor="middle">Local Storage (p0)</text>
  <text x="1010" y="160" class="node-text" text-anchor="middle">~/swarm-data/appdata</text>
  <text x="1010" y="180" class="node-text" text-anchor="middle">Application Data</text>

  <!-- Arrow: Local to Rsync -->
  <path d="M 1010 190 L 1010 240" class="connection" marker-end="url(#arrowhead)"/>
  <text x="1020" y="220" class="label-text">rsync</text>

  <!-- NFS Share on Unraid -->
  <rect x="900" y="250" width="220" height="80" rx="10" class="storage-box"/>
  <text x="1010" y="275" class="node-title" text-anchor="middle">Unraid NFS Share</text>
  <text x="1010" y="300" class="node-text" text-anchor="middle">~/swarm/appdata</text>
  <text x="1010" y="320" class="node-text" text-anchor="middle">NFS Mount</text>

  <!-- Unraid Host -->
  <rect x="900" y="370" width="220" height="100" rx="10" class="node-box"/>
  <text x="1010" y="395" class="node-title" text-anchor="middle">Unraid Host</text>
  <text x="1010" y="415" class="node-text" text-anchor="middle">10-core / 16 threads</text>
  <text x="1010" y="435" class="node-text" text-anchor="middle">64GB RAM</text>
  <text x="1010" y="455" class="node-text" text-anchor="middle">Nvidia 2080 Super</text>

  <!-- Arrow: NFS to Unraid -->
  <path d="M 1010 330 L 1010 360" class="connection" marker-end="url(#arrowhead)"/>

  <!-- Duplicati -->
  <rect x="900" y="510" width="220" height="60" rx="10" class="backup-box"/>
  <text x="1010" y="535" class="node-title" text-anchor="middle">Duplicati</text>
  <text x="1010" y="555" class="node-text" text-anchor="middle">Backup Automation</text>

  <!-- Arrow: Unraid to Duplicati -->
  <path d="M 1010 470 L 1010 500" class="connection" marker-end="url(#arrowhead)"/>

  <!-- Google Drive Backup -->
  <rect x="900" y="620" width="220" height="80" rx="10" class="cloud-box"/>
  <text x="1010" y="645" class="node-title" text-anchor="middle">Google Drive</text>
  <text x="1010" y="665" class="node-text" text-anchor="middle">Cloud Backup</text>
  <text x="1010" y="685" class="node-text" text-anchor="middle">(Off-site)</text>

  <!-- Arrow: Duplicati to Google Drive -->
  <path d="M 1010 570 L 1010 610" class="connection" marker-end="url(#arrowhead)"/>

  <!-- Local Backup Drive -->
  <rect x="900" y="750" width="220" height="80" rx="10" class="backup-box"/>
  <text x="1010" y="775" class="node-title" text-anchor="middle">Dedicated Backup Drive</text>
  <text x="1010" y="795" class="node-text" text-anchor="middle">Spin-up on Demand</text>
  <text x="1010" y="815" class="node-text" text-anchor="middle">(Local cold storage)</text>

  <!-- Arrow: Duplicati to Local Drive -->
  <path d="M 1010 570 Q 1180 590, 1180 790 L 1130 790" class="connection" marker-end="url(#arrowhead)"/>

  <!-- Network Overlay -->
  <text x="70" y="600" class="section-title">Network Architecture</text>

  <rect x="50" y="620" width="700" height="100" rx="10" style="fill: #ecf0f1; stroke: #bdc3c7; stroke-width: 2;"/>
  <text x="400" y="645" class="node-title" text-anchor="middle" style="fill: #2c3e50;">Encrypted Overlay Network: "homelab"</text>
  <text x="400" y="670" class="node-text" text-anchor="middle" style="fill: #34495e;">All services communicate through encrypted overlay</text>
  <text x="400" y="690" class="node-text" text-anchor="middle" style="fill: #34495e;">Traefik handles SSL/TLS termination (Let's Encrypt via Cloudflare DNS-01)</text>

  <!-- Key Features -->
  <text x="70" y="770" class="section-title">Key Features</text>

  <text x="70" y="800" class="label-text">✓ Automated CI/CD: Gitea webhooks → N8N → Docker stack deploy</text>
  <text x="70" y="825" class="label-text">✓ Automated SSL/TLS: Let's Encrypt certificates via Traefik</text>
  <text x="70" y="850" class="label-text">✓ Centralized Auth: Authentik SSO for all services</text>
  <text x="70" y="875" class="label-text">✓ Multi-tier Backup: Local → NFS → Cloud + Cold Storage</text>
  <text x="70" y="900" class="label-text">✓ High Availability: 4-node swarm cluster with service distribution</text>
  <text x="70" y="925" class="label-text">✓ Resource Isolation: Services constrained to appropriate nodes</text>

  <!-- Connection from Swarm to Services -->
  <path d="M 150 230 L 150 280 L 400 280 L 400 300" class="connection" marker-end="url(#arrowhead)"/>

  <!-- Connection from Swarm to Storage -->
  <path d="M 250 170 L 890 170 L 890 150 L 890 150" class="connection" marker-end="url(#arrowhead)"/>
  <text x="550" y="165" class="label-text">Application data stored on leader node</text>

</svg>
